<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/rasd-app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="رصد — يحوّل ملاحظات الميدان الصحي إلى احتياجات واضحة وقرارات ومبادرات تطوعية.">
  <meta name="theme-color" content="#0B1430">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="رصد">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>رصد · RASD</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1430; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 90% at 35% 20%, #23407E 0%, #142553 55%, #0B1430 100%); transition: opacity .4s ease; }
    #boot img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 20px 60px rgba(45,212,191,.18); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function () { b.remove(); }, 450); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
